services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: skincare
      POSTGRES_PASSWORD: skincare_dev_password
      POSTGRES_DB: skincare_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://skincare:skincare_dev_password@db:5432/skincare_dev
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./uploaded_scans:/app/uploaded_scans
      - ./scripts/data:/app/scripts/data

volumes:
  postgres_data: